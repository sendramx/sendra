<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sendra - Correo confirmado</title>
  <link rel="icon" type="image/svg+xml" href="logotipo/sendra-logo-color.svg">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main>
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="logotipo/sendra-logo-blanco.svg">
      <img class="logo" src="logotipo/sendra-logo-color.svg" alt="Sendra">
    </picture>

    <section class="confirmacion">
      <div class="palomita" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="5 12.5 10 17.5 19 7.5"></polyline>
        </svg>
      </div>
      <h1>¡Correo confirmado!</h1>
      <p>Tu cuenta ya está activa. Regresa a Sendra e inicia sesión.</p>
    </section>
  </main>

  <footer>
    ¿Dudas? Escríbenos a <a href="mailto:sendra.contacto@gmail.com">sendra.contacto@gmail.com</a>
  </footer>
</body>
</html>
